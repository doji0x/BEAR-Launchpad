name: Native pair checks
on:
  push:
    branches: ['feat/native-pair-phases-1-2', main]
    paths: ['src/**', 'base44/**', 'tests/**', 'package*.json', '.github/workflows/native-pair-checks.yml']
  pull_request:
    paths: ['src/**', 'base44/**', 'tests/**', 'package*.json', '.github/workflows/native-pair-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-pair-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install exactly the committed dependency graph
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Pinned official SDK dependency evidence
        run: npm ls @pump-fun/pump-sdk @pump-fun/pump-swap-sdk @solana/spl-token @solana/web3.js
      - name: Real SDK quote, treasury and transaction-size tests
        run: node --test tests/treasury/*.test.mjs
      - name: Public launch, recovery, policy and setup tests
        run: node --import ./tests/native/register.mjs --test tests/native/*.test.mjs
      - name: Historical creator claims and reward ledger regressions
        run: node --import ./tests/claims/register.mjs --test tests/claims/*.test.mjs
      - name: Historical atomic signing and submit-button regressions
        run: |
          node --test tests/atomic-v1/*.test.mjs
          node --test tests/atomic-v1-ui/*.test.cjs
      - name: Production Deno runtime adapters and builders
        run: deno test --node-modules-dir=manual --no-check --allow-read --allow-env --allow-sys tests/native/deno.test.ts
      - name: Independent Deno npm installation
        run: |
          mkdir -p "$RUNNER_TEMP/bear-deno"
          cp -R base44 tests "$RUNNER_TEMP/bear-deno/"
          cp tests/native/deno-package.json "$RUNNER_TEMP/bear-deno/package.json"
          cd "$RUNNER_TEMP/bear-deno"
          deno install --node-modules-dir=auto
          deno test --node-modules-dir=auto --no-check --allow-read --allow-env --allow-sys tests/native/deno.test.ts
      - name: Lint
        run: npm run lint
      - name: Production build
        run: npm run build
      - name: Retain application-wide typecheck diagnostics separately
        if: always()
        run: |
          mkdir -p native-pair-evidence
          if npm run typecheck > native-pair-evidence/typecheck.txt 2>&1; then
            echo 'Application typecheck passed.'
          else
            echo '::warning::Application-wide typecheck failed. Review retained diagnostics and the existing base/head typecheck workflow; native-pair tests do not waive this failure.'
          fi
          cp package.json package-lock.json native-pair-evidence/
          git diff --exit-code -- package.json package-lock.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-pair-validation
          path: native-pair-evidence
          retention-days: 3
