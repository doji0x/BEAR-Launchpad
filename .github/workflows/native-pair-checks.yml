name: Native pair checks
on:
  push:
    branches: ['feat/native-pair-phases-1-2']
  pull_request:
    paths: ['src/**', 'base44/**', 'tests/**', 'package*.json', '.github/workflows/native-pair-checks.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-pair-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official native-pair SDKs without lifecycle scripts
        run: npm install --save-exact --ignore-scripts --no-audit --no-fund @pump-fun/pump-sdk@4.0.0 @pump-fun/pump-swap-sdk@2.1.0
      - name: SDK interface evidence
        run: |
          node <<'JS'
          const sdk = require('@pump-fun/pump-sdk');
          for (const name of ['createV2Instruction','createV2AndBuyV2Instructions','getBuyV2InstructionRaw','createFeeSharingConfig','updateFeeSharesV2']) console.log(name, String(sdk.PUMP_SDK[name]));
          console.log('getBuyTokenAmountFromSolAmount', String(sdk.getBuyTokenAmountFromSolAmount));
          console.log('resolveQuoteMint', String(sdk.OnlinePumpSdk.prototype.resolveQuoteMint));
          JS
      - name: Treasury tests
        if: always()
        run: node --test tests/treasury/*.test.mjs
      - name: Build
        if: always()
        run: npm run build
      - name: Lint
        if: always()
        run: npm run lint
      - name: Retain tracked source and public dependency packages
        if: always()
        run: |
          mkdir -p native-pair-evidence
          git archive HEAD > native-pair-evidence/source.tar
          cp package.json package-lock.json native-pair-evidence/
          if [ -d node_modules ]; then tar -czf native-pair-evidence/node-modules.tar.gz node_modules; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-pair-test-evidence
          path: native-pair-evidence
          retention-days: 1
